name: Refresh NCAA Football

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# All workflows that write public data / deploy Pages should use this SAME group.
# This prevents catalog, collegiate, football, etc. from racing each other.
concurrency:
  group: "active-offerings-data-and-pages"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main before processing
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Auto-map and run NCAA Football age discovery
        run: python3 scripts/refresh_ncaa_football.py

      - name: Commit NCAA Football mapping and age-review data
        run: |
          git config user.name "active-offerings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ncaa-football-sources.json \
                  data/ncaa-football-data.json \
                  data/ncaa-football-age-review.json \
                  data/review-data.json

          if git diff --cached --quiet; then
            echo "No NCAA Football data changes to commit."
          else
            git commit -m "Refresh NCAA Football mapping and age discovery"

            # Another human/manual commit can still occur during a long screening run.
            # Rebase our generated commit onto the newest main instead of rejecting the push.
            git fetch origin main
            git rebase origin/main

            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
