name: Deep Tennis Age Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write

concurrency:
  group: "active-offerings-data-and-pages"
  cancel-in-progress: false

jobs:
  deep-age-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset to main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install Chromium
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Resolve unresolved tennis ages
        env:
          TENNIS_AGE_BATCH: "120"
        run: python3 scripts/refresh_tennis_age_scan.py

      - name: Commit age cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tennis-age-cache.json
          if git diff --cached --quiet; then
            echo "No age-cache changes."
            exit 0
          fi
          git commit -m "Deep tennis age cache refresh"
          git pull --rebase origin main
          git push origin main
