name: Update NRGC Catalog

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "active-offerings-data-and-pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install catalog parser
        run: python3 -m pip install --quiet requests beautifulsoup4 pypdf

      - name: Discover and parse current NRGC catalog
        run: python3 scripts/update_catalog.py

      - name: Commit current catalog data
        run: |
          git config user.name "active-offerings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/catalog-current.pdf data/catalog-live.json data/catalog-status.json

          if git diff --cached --quiet; then
            echo "Catalog content unchanged."
          else
            git commit -m "Update current NRGC sports wagering catalog"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
