name: Refresh NCAA Basketball Age Cache

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: active-offerings-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Build NCAA Basketball age cache
        run: python3 scripts/refresh_ncaa_basketball_age_cache.py

      - name: Build NCAA Basketball age research queue
        run: python3 scripts/build_ncaa_basketball_age_research_queue.py

      - name: Commit age intelligence
        run: |
          git config user.name "active-offerings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaa-basketball-age-cache.json data/ncaa-basketball-age-research-queue.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh NCAA basketball age intelligence"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
