name: Refresh Approved Sports Schedule

on:
  push:
    branches:
      - main
    paths:
      - data/catalog-season-map.json
      - data/global-schedule-sources.json
      - data/soccer-*-sources.json
      - data/tennis-schedule.json
      - scripts/refresh_global_schedule.py
      - tests/test_competition_identity_registry.py
      - .github/workflows/refresh-global-schedule.yml
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: active-offerings-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Install dependencies
        run: python3 -m pip install --quiet requests
      - name: Run refresh
        run: python3 scripts/refresh_global_schedule.py
      - name: Rebuild competition identities and reviewed aliases
        run: python3 scripts/build_competition_identity_registry.py
      - name: Validate division mappings and aliases
        run: python3 -m unittest tests.test_competition_identity_registry tests.test_basketball_divisions
      - name: Commit refreshed data
        run: |
          git config user.name "active-offerings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/global-schedule.json data/competition-identity-registry.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh approved sports schedule"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
