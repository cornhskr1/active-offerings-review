name: Refresh Tennis U18 Registry

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: write

concurrency:
  group: tennis-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Install Chromium
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Refresh verified U18 registry and current fields
        env:
          TENNIS_REFRESH_REGISTRY: "1"
        run: python3 scripts/refresh_tennis_intelligence.py
      - name: Build focused review feed
        run: python3 scripts/build_tennis_review.py
      - name: Run guardrail tests
        run: python3 -m unittest tests/test_build_tennis_review.py
      - name: Commit refreshed data
        run: |
          git config user.name "active-offerings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tennis-intelligence.json data/tennis-schedule.json data/tennis-u18-registry.json data/tennis-exceptions.json data/tennis-age-cache.json data/tennis-review.json
          if git diff --cached --quiet; then
            echo "No tennis registry changes."
            exit 0
          fi
          git commit -m "Refresh tennis U18 registry"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
