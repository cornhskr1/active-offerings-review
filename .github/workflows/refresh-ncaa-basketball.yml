name: Refresh NCAA Basketball

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: active-offerings-data
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: python3 -m pip install --quiet 'requests==2.34.2' 'beautifulsoup4==4.15.0'

      - name: Refresh NCAA Basketball Division I map
        run: python3 scripts/refresh_ncaa_basketball_di_map.py

      - name: Run NCAA basketball refresh
        run: python3 scripts/refresh_ncaa_basketball.py

      - name: Run NCAA basketball intelligence
        run: python3 scripts/refresh_ncaa_basketball_intelligence.py

      - name: Commit refreshed basketball data
        run: |
          git config user.name "active-offerings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaa-basketball-di-map.json data/ncaa-basketball.json data/ncaa-basketball-intelligence.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh NCAA basketball schedule"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
