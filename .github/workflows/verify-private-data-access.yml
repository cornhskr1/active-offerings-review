name: Verify Private Data Access (manual dry run)
on:
  pull_request:
    paths:
      - "scripts/fetch_private_data_candidate.py"
      - "scripts/verify_external_data_candidate.py"
      - "tests/test_fetch_private_data_candidate.py"
      - ".github/workflows/verify-private-data-access.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_fetch_private_data_candidate tests.test_external_data_candidate -v
  private-read:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate authenticated snapshot without deploying
        env:
          DATA_REPO_READ_TOKEN: ${{ secrets.DATA_REPO_READ_TOKEN }}
        run: python -m scripts.fetch_private_data_candidate "$RUNNER_TEMP/private-candidate"
