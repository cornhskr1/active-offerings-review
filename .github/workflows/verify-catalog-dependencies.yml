name: Verify Catalog Python Dependencies
on:
  pull_request:
    paths:
      - ".github/workflows/update-catalog.yml"
      - ".github/workflows/verify-catalog-dependencies.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned catalog dependencies
        run: python -m pip install --quiet 'requests==2.34.2' 'beautifulsoup4==4.15.0' 'pypdf==6.21.2'
      - name: Check imports and resolver consistency
        run: |
          python -m pip check
          python - <<'PY'
          import requests, bs4, pypdf
          assert requests.__version__ == "2.34.2", requests.__version__
          assert bs4.__version__ == "4.15.0", bs4.__version__
          assert pypdf.__version__ == "6.21.2", pypdf.__version__
          print("Catalog dependency versions installed and imported successfully")
          PY
