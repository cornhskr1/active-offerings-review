name: Verify Authenticated Private Data Overlay (manual dry run)
on:
  pull_request:
    paths:
      - ".github/workflows/verify-private-data-overlay.yml"
      - "scripts/fetch_private_data_candidate.py"
      - "scripts/preview_private_data_overlay.py"
      - "tests/test_preview_private_data_overlay.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify offline overlay, fetch, and staging guards
        run: python -m unittest tests.test_preview_private_data_overlay tests.test_fetch_private_data_candidate tests.test_external_data_candidate tests.test_odds_pages_staging -q
  authenticated-preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build isolated public-site stage without provider calls
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from scripts.stage_odds_pages import stage
          stage(Path.cwd(), Path(os.environ["RUNNER_TEMP"]) / "original-site")
          PY
      - name: Fetch pinned private data and build validated overlay
        env:
          DATA_REPO_READ_TOKEN: ${{ secrets.DATA_REPO_READ_TOKEN }}
        run: |
          python -m scripts.fetch_private_data_candidate "$RUNNER_TEMP/private-candidate"
          python - <<'PY'
          from pathlib import Path
          import os, hashlib
          from scripts.preview_private_data_overlay import overlay
          root = Path(os.environ["RUNNER_TEMP"])
          site = root / "original-site"
          before = {name:hashlib.sha256((site/name).read_bytes()).hexdigest() for name in ("index.html","data/status.json","data/review-data.json")}
          changed = overlay(site, root/"private-candidate", root/"preview-only")
          after = {name:hashlib.sha256((site/name).read_bytes()).hexdigest() for name in before}
          if before != after:
              raise SystemExit("Original site changed during preview")
          if (root/"preview-only/index.html").read_bytes() != (site/"index.html").read_bytes():
              raise SystemExit("Site HTML changed during data overlay")
          print("PASS: validated private overlay, approved files:", ", ".join(changed))
          print("PASS: original staged site unchanged; no deployment performed")
          PY
