name: Refresh Priority Queue

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "active-offerings-data-and-pages"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Build dynamic priority queue
        run: python3 scripts/refresh_priority_queue.py

      - name: Commit priority queue data
        run: |
          git config user.name "active-offerings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/priority-queue.json

          if git diff --cached --quiet; then
            echo "No priority queue changes to commit."
          else
            git commit -m "Refresh dynamic priority queue"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
