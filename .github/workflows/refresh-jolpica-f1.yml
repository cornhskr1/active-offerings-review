name: Refresh Licensed F1 Schedule

on:
  schedule:
    - cron: "31 10 * * *"
  workflow_dispatch:
    inputs:
      resume_after_review:
        description: 'Resume only after reviewing a failed or uncertain source persistence run'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: active-offerings-data
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Verify prior source persistence
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_AFTER_REVIEW: ${{ inputs.resume_after_review || false }}
        run: python scripts/check_jolpica_refresh_safety.py
      - name: Refresh isolated daily F1 schedule
        run: python scripts/refresh_jolpica_f1.py --previous data/jolpica-f1-events.json --output data/jolpica-f1-events.json
      - name: Persist only licensed F1 observations
        run: |
          git config user.name "active-offerings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jolpica-f1-events.json
          if git diff --cached --quiet; then
            echo "No new F1 observations."
            exit 0
          fi
          git commit -m "Refresh isolated licensed F1 schedule"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
