name: Verify Priority 2 source health

on:
  pull_request:
    paths:
      - "scripts/refresh_tennis_intelligence.py"
      - "scripts/tennis_refresh_guardrails.py"
      - "scripts/publisher_basketball_beach.py"
      - "scripts/refresh_global_schedule.py"
      - ".github/workflows/verify-priority2-source-health.yml"

permissions:
  contents: read

jobs:
  challenger_diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official calendar responses
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          urls=[
            'https://www.atptour.com/en/atp-challenger-tour/calendar',
            'https://www.atptour.com/en/atp-challenger-tour/calendar?year=2026',
            'https://www.atptour.com/en/atp-challenger-tour/calendar?surfaceType=hard&year=2026',
            'https://www.atptour.com/en/scores/results-archive?tournamentType=ch&year=2026',
          ]
          with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True)
            page=browser.new_page()
            for url in urls:
              try:
                response=page.goto(url,wait_until='domcontentloaded',timeout=25000)
                page.wait_for_timeout(2500)
                body=page.locator('body').inner_text(timeout=5000)
                links=page.locator('a[href*="/en/tournaments/"]').evaluate_all(
                  'els=>els.slice(0,5).map(a=>({text:a.innerText,href:a.href,parent:a.parentElement?.innerText?.slice(0,250)}))')
                print({'url':url,'status':response.status if response else None,
                       'body_length':len(body),'has_columbus':'Columbus Challenger' in body,
                       'body_sample':body[-1200:],'links':links},flush=True)
              except Exception as exc:
                print({'url':url,'error':str(exc)[:250]},flush=True)
            browser.close()
          PY
  tennis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Run guarded publisher refresh without publishing data
        env:
          TENNIS_REFRESH_REGISTRY: "0"
        run: python3 scripts/refresh_tennis_intelligence.py
      - name: Report ATP Challenger discovery
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/tennis-intelligence.json').read_text())
          print(json.dumps(data.get('source_health',{}).get('atp_challenger',{}),indent=2))
          PY
  nbb:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Install parser dependencies
        run: python3 -m pip install --quiet requests lxml
      - name: Probe exact NBB schedule page (publisher block remains visible)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from publisher_basketball_beach import fetch_nbb_schedule,parse_nbb_fixtures
          source={'catalog_terms':['Novo Basquete Brasil (NBB) | Men']}
          page=fetch_nbb_schedule('https://lnb.com.br/nbb/tabela-de-jogos')
          print('Verified NBB fixtures:',len(parse_nbb_fixtures(page,source)))
          PY
