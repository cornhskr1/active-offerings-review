name: Verify Priority 2 provider changes

on:
  pull_request:

permissions:
  contents: read

jobs:
  provider-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Install parser dependencies
        run: python3 -m pip install --quiet requests lxml beautifulsoup4 pypdf pdfplumber
      - name: Validate changed Priority 2 provider batch
        run: python3 scripts/run_priority2_pr_gate.py

  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install parser dependencies
        run: python3 -m pip install --quiet requests lxml beautifulsoup4 pypdf pdfplumber
      - name: Run full regression
        run: python3 -m unittest discover -s tests -q
