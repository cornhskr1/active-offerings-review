name: Verify Priority 2 provider changes

on:
  pull_request:
    paths:
      - "scripts/**"
      - "data/*.json"
      - "tests/**"
      - ".github/workflows/verify-priority2-source-health.yml"

permissions:
  contents: read

jobs:
  provider-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install parser dependencies
        run: python3 -m pip install --quiet requests lxml beautifulsoup4 pypdf pdfplumber
      - name: Validate changed Priority 2 provider batch
        run: python3 scripts/run_priority2_pr_gate.py

  full-regression:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install parser dependencies
        run: python3 -m pip install --quiet requests lxml beautifulsoup4 pypdf pdfplumber
      - name: Run full regression as non-blocking signal
        run: python3 -m unittest discover -s tests -q
