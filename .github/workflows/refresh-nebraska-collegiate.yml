name: Refresh Nebraska Collegiate

on:
  push:
    branches: [main]
    paths:
      - scripts/official_school_calendar.py
      - scripts/refresh_official_school_calendars.py
      - data/official-school-calendar-sources.json
      - .github/workflows/refresh-nebraska-collegiate.yml
  schedule:
    - cron: "11 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: active-offerings-data
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Install dependencies
        run: python3 -m pip install --quiet 'requests==2.34.2' 'beautifulsoup4==4.15.0'
      - name: Run Today + 7 refresh
        run: python3 scripts/refresh_official_school_calendars.py

      - name: Commit refreshed data
        run: |
          git config user.name "active-offerings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nebraska-collegiate-live.json data/nebraska-collegiate-futures.json data/official-school-calendar-cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh Nebraska collegiate schedule review"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
