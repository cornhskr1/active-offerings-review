name: Refresh Nebraska Collegiate

on:
  schedule:
    - cron: "11 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: active-offerings-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Install dependencies
        run: python3 -m pip install --quiet requests beautifulsoup4
      - name: Run refresh
        run: python3 scripts/refresh_nebraska_collegiate.py
      - name: Commit refreshed data
        run: |
          git config user.name "active-offerings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nebraska-collegiate-live.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh Nebraska collegiate schedule review"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
