name: Verify generated-data workflow queue

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tests/test_data_workflow_queue.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tests/test_data_workflow_queue.py'

permissions:
  contents: read

jobs:
  queue-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify shared queue and safe publication ordering
        run: python3 -m unittest discover -s tests -p 'test_data_workflow_queue.py' -v
