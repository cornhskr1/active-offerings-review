name: Verify generated-data workflow queue

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tests/test_data_workflow_queue.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tests/test_data_workflow_queue.py'

permissions:
  contents: read

jobs:
  queue-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify shared queue and safe publication ordering
        run: python3 -m unittest discover -s tests -p 'test_data_workflow_queue.py' -v
