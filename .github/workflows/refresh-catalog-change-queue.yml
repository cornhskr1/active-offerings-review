name: Refresh Catalog Change Queue

on:
  push:
    branches:
      - main
    paths:
      - data/catalog-live.json
      - data/catalog-season-map.json
      - data/catalog-official-sources.json
      - data/global-schedule-sources.json
      - data/soccer-*-sources.json
      - scripts/build_catalog_change_queue.py
      - .github/workflows/refresh-catalog-change-queue.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-change-queue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Build fail-closed change queue
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/build_catalog_change_queue.py

      - name: Commit change queue
        run: |
          git config user.name "active-offerings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-change-queue.json
          if git diff --cached --quiet; then
            echo "Catalog change queue unchanged."
            exit 0
          fi
          git commit -m "Refresh catalog change queue"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
