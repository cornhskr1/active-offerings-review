name: Refresh Competition Identity Registry

on:
  push:
    branches:
      - main
    paths:
      - data/competition-alias-crosswalk.json
      - data/catalog-season-map.json
      - data/catalog-live.json
      - data/global-schedule.json
      - scripts/build_competition_identity_registry.py
      - .github/workflows/refresh-competition-identity-registry.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: active-offerings-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Rebuild reviewed identities and aliases
        run: python3 scripts/build_competition_identity_registry.py
      - name: Validate division mappings and aliases
        run: python3 -m unittest tests.test_competition_identity_registry tests.test_basketball_divisions
      - name: Commit changed registry
        run: |
          git config user.name "active-offerings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/competition-identity-registry.json
          if git diff --cached --quiet; then
            echo "Competition registry is already current."
            exit 0
          fi
          git commit -m "Refresh competition identity registry"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
