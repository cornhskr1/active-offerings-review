name: Verify staff dashboard

on:
  pull_request:
    paths:
      - index.html
      - assets/catalog-health-summary.js
      - tests/test_catalog_health_summary.py
      - tests/test_coverage_health_ui.py
      - tests/test_dashboard_scope.py
      - tests/test_review_today_divisions.py
      - tests/test_priority2_review_workflow.py
      - tests/test_published_data_status.py
      - tests/test_daily_review_clarity.py
      - .github/workflows/verify-dashboard.yml
  push:
    branches: [main]
    paths:
      - index.html
      - assets/catalog-health-summary.js
      - tests/test_catalog_health_summary.py
      - tests/test_coverage_health_ui.py
      - tests/test_dashboard_scope.py
      - tests/test_review_today_divisions.py
      - tests/test_priority2_review_workflow.py
      - tests/test_published_data_status.py
      - tests/test_daily_review_clarity.py
      - .github/workflows/verify-dashboard.yml

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check dashboard JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/dashboard-script.js').write_text(re.search(r'<script>([\s\S]*)</script>', html).group(1))
          PY
          node --check /tmp/dashboard-script.js
      - name: Verify staff views, division coverage, and published-data status
        run: python3 -m unittest tests.test_dashboard_scope tests.test_review_today_divisions tests.test_priority2_review_workflow tests.test_published_data_status tests.test_daily_review_clarity tests.test_catalog_health_summary tests.test_coverage_health_ui -q
