name: Refresh public data

on:
  schedule:
    # Every 3 hours. GitHub scheduled workflows use UTC.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh public source status
        run: python3 scripts/refresh_public_data.py

      - name: Commit refreshed data
        run: |
          git config user.name "active-offerings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/review-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh public source status"
            git push
          fi
