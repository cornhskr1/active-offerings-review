name: Verify zero-quota event integration
on:
  pull_request:
    paths:
      - index.html
      - assets/odds-session.js
      - data/odds-api-catalog-mappings.json
      - scripts/odds_api_adapter.py
      - scripts/refresh_odds_api_events.py
      - scripts/stage_odds_pages.py
      - scripts/recover_verified_pages_cache.py
      - tests/test_verified_pages_cache_recovery.py
      - scripts/check_odds_deploy_safety.py
      - tests/test_refresh_odds_api_events.py
      - tests/test_odds*.py
      - .github/workflows/deploy-pages.yml
      - .github/workflows/verify-odds-events.yml
  push:
    branches: [main]
    paths:
      - index.html
      - assets/odds-session.js
      - data/odds-api-catalog-mappings.json
      - scripts/odds_api_adapter.py
      - scripts/refresh_odds_api_events.py
      - scripts/stage_odds_pages.py
      - scripts/recover_verified_pages_cache.py
      - tests/test_verified_pages_cache_recovery.py
      - scripts/check_odds_deploy_safety.py
      - tests/test_refresh_odds_api_events.py
      - tests/test_odds*.py
      - .github/workflows/deploy-pages.yml
      - .github/workflows/verify-odds-events.yml
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --check assets/odds-session.js
      - name: Verify event scope, zero-credit guards, caching and deployment isolation
        run: |
          python -m unittest discover -s tests -p 'test_odds*.py' -v
          python -m unittest discover -s tests -p 'test_refresh_odds_api_events.py'
          python -m unittest discover -s tests -p 'test_verified_pages_cache_recovery.py' -v
